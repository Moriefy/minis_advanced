name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r28 + CMake
        run: |
          sdkmanager "ndk;28.0.13004108" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Create provider-customization.properties
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Prepare Android sandbox assets
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          bash scripts/prepare_android_sandbox.sh

      - name: Build Debug APK
        working-directory: src/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
